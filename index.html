<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Warkop Coin Hunter - game berburu koin bertema warung kopi Indonesia" />
  <title>Warkop Coin Hunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="default" data-time="day">
  <!-- ======================= BOOT / LOADING ======================= -->
  <div id="boot" class="boot">
    <div class="boot__logo">
      <span class="boot__cup">☕</span>
      <h1>Warkop<span>CoinHunter</span></h1>
    </div>
    <div class="boot__bar"><div class="boot__fill"></div></div>
    <p class="boot__status">Menyeduh kopi...</p>
  </div>

  <!-- ======================= MAIN MENU ======================= -->
  <main id="menu" class="screen screen--menu hidden">
    <div class="menu__bg" aria-hidden="true">
      <span class="steam s1">~</span><span class="steam s2">~</span><span class="steam s3">~</span>
    </div>
    <div class="menu__card">
      <div class="menu__brand">
        <span class="menu__cup">☕</span>
        <div>
          <h1 class="menu__title">Warkop Coin Hunter</h1>
          <p class="menu__tag">Berburu koin, bangun warkop impianmu</p>
        </div>
      </div>

      <div class="menu__stats" id="menuStats"></div>

      <div class="menu__actions">
        <button class="btn btn--primary" data-action="play">▶ Main</button>
        <button class="btn" data-action="warkop">🏪 Warkop</button>
        <button class="btn" data-action="album">📒 Album</button>
        <button class="btn" data-action="fusion">⚗️ Coin Fusion</button>
        <button class="btn" data-action="settings">⚙️ Pengaturan</button>
      </div>

      <div class="menu__footer">
        <span id="seasonBadge" class="season-badge">🎏 Tema: Normal</span>
        <span id="netBadge" class="net-badge">● Offline Mode</span>
      </div>
    </div>
  </main>

  <!-- ======================= GAME SCREEN ======================= -->
  <section id="game" class="screen screen--game hidden">
    <!-- HUD -->
    <header class="hud">
      <button class="hud__back btn btn--ghost" data-action="menu">‹ Menu</button>
      <div class="hud__group">
        <div class="hud__chip" title="Koin terkumpul">🪙 <b id="hudCoins">0</b></div>
        <div class="hud__chip" title="Permata (hasil misi)">💎 <b id="hudGems">0</b></div>
        <div class="hud__chip" title="Level warkop">⭐ Lv <b id="hudLevel">1</b></div>
      </div>
      <div class="hud__group">
        <div class="hud__chip hud__chip--time" id="hudTime">🌞 Siang</div>
        <button class="hud__icon" data-action="toggleTime" title="Ganti siang/malam">🌓</button>
        <button class="hud__icon" data-action="inventory" title="Inventory">🎒</button>
      </div>
    </header>

    <!-- Playfield -->
    <div class="stage" id="stage">
      <canvas id="scene" width="960" height="540" aria-label="Area warkop tempat berburu koin"></canvas>
      <div class="stage__hint" id="stageHint">Gunakan <b>WASD</b> / panah atau geser untuk bergerak. Dekati koin untuk mengambil.</div>
      <div class="toast-wrap" id="toasts"></div>
    </div>

    <!-- Mobile controls -->
    <div class="pad" id="pad" aria-hidden="true">
      <button class="pad__btn" data-dir="up">▲</button>
      <div class="pad__row">
        <button class="pad__btn" data-dir="left">◀</button>
        <button class="pad__btn" data-dir="down">▼</button>
        <button class="pad__btn" data-dir="right">▶</button>
      </div>
    </div>
  </section>

  <!-- ======================= MODALS ======================= -->
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="modal" id="modal">
      <button class="modal__close" data-action="close" aria-label="Tutup">✕</button>
      <div class="modal__body" id="modalBody"><!-- injected --></div>
    </div>
  </div>

  <!-- Live region for accessibility announcements -->
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
